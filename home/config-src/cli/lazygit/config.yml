# lazygit renders diffs through delta (Catppuccin theme comes from the
# [delta] section of ~/.gitconfig). `|` cycles renderers.
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --width={{width}} {{if gt .width 160}}--side-by-side{{end}}
      name: delta
    - command: delta --{{colorScheme}} --paging=never --side-by-side --width={{width}}
      name: delta side-by-side
    - type: rawGit
      name: default
